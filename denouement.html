<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>denouement</title>
    <style>
        html, body {
            background-color: #000000;
            color: #ffffff;
            font-family: initial;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .frame {
            border: 2px solid #ffffff;
            padding: 3em 2.5em;
            max-width: 420px;
            width: 90%;
            box-sizing: border-box;
        }

        h2 {
            font-size: 1.4rem;
            font-weight: normal;
            line-height: 1.5;
            margin: 0 0 1.8em;
        }

        audio {
            width: 100%;
            margin-bottom: 1.8em;
            filter: invert(1);
        }

        .instruction {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #dddddd;
            margin: 0 0 2em;
        }

        .footer {
            font-size: 1.25rem;
            font-weight: bold;
            letter-spacing: 1px;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="frame">
        <h2>Congratulations<br>you have done it.</h2>

       <audio controls>
            <source src="poem test read.mp4" type="audio/mp4">
            Your browser does not support the audio element.
        </audio>
        <p class="instruction">Pry open the sense of hearing,<br>and await for a return</p>

        <p class="footer">Coming Soon.</p>
    </div>

</body>
</html>
